<html lang="es">
<head>

<style>
:root{--navy:#14213d;--navy2:#1f3260;--gold:#f5b301;--gold2:#ffd966;--bg:#f6f3ea;--card:#fff;--ink:#1b2333;--mut:#6b7385;--line:#e4dfd2;--ok:#1f9d55;--warn:#d97706;--bad:#c53030;--grass:#6aa33a;--dirt:#7b5433;--dirt2:#5c3d24;--px:"Jersey 15",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
html,body,button,a,input,select{touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 110px}
.wrap.haslote{padding-bottom:190px}
.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top .logo{width:34px;height:34px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.top h1{font-size:17px;margin:0;line-height:1.1}
.top small{color:#b9c3dd;font-size:12px}
.top .sp{flex:1}
.top .lnk{color:#fff;font-size:14px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.bank{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0;position:relative;overflow:hidden}
.bank:after{content:"";position:absolute;right:-26px;bottom:-40px;width:170px;height:170px;opacity:.16;background:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2 22 7 12 12 2 7z%27 fill=%27%23ffe27a%27/%3E%3Cpath d=%27M2 7 12 12v10L2 17z%27 fill=%27%23d9a514%27/%3E%3Cpath d=%27M22 7 12 12v10l10-5z%27 fill=%27%23a87b0a%27/%3E%3C/svg%3E") center/contain no-repeat}
.ic{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.16em;flex:none;object-fit:contain}
.logo .ic{width:70%;height:70%}
.nl{display:inline-block;min-width:1.7em;margin-right:6px;padding:1px 0;border-radius:6px;background:rgba(127,127,127,.16);color:var(--mut,#777);font-style:normal;font-size:.78em;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}.tv .avw{position:relative;flex:none;height:76%;max-height:4.3vw;aspect-ratio:1}.tv .avw .av{height:100%!important;width:100%;max-height:none!important}.tv .nl{position:absolute;left:-.35vw;bottom:-.35vw;margin:0;min-width:1.5vw;padding:.05vw .25vw;font-size:.95vw;background:#0c0c12;color:#fff;text-shadow:none;border-radius:0}.tv .kid .kn b{font-weight:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{margin:2px 0 12px}.wm{margin-bottom:10px}.wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:6px}.wh span{color:var(--mut);font-size:13px}.wh .ok{color:var(--ok);font-weight:700}
.ws{display:flex;flex-wrap:wrap;gap:6px}.ws i,.wl i{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;font-style:normal;font-weight:700;font-size:14px;background:#eef0f4;color:#8a90a0;border:2px solid transparent}
.ws i.si,.wl i.si{background:#e3f6e8;color:var(--ok)}.ws i.falta,.wl i.falta{background:#fdecec;color:#c0392b}.ws i.vac,.wl i.vac{background:repeating-linear-gradient(45deg,#f1f1f1 0 4px,#e2e2e2 4px 8px);color:#999}.ws i.cur,.wl i.cur{border-color:var(--navy)}
.wl{margin:6px 0 0;font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}.wl i{width:20px;height:20px;font-size:11px;border-radius:6px;border-width:1.5px}
.apl div{display:grid;grid-template-columns:64px auto 1fr;gap:4px 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.apl div:first-child{border-top:0}.apl span{color:var(--mut);font-size:13px}.apl small{color:var(--mut);font-size:13px;text-align:right}
.wh b small{font-weight:500;color:var(--mut);font-size:12px;margin-left:4px}.wvac{margin:0 0 10px;padding:8px 10px;border-radius:9px;font-size:13px;color:#777;background:repeating-linear-gradient(45deg,#f4f4f4 0 6px,#ececec 6px 12px)}
.st .n{display:flex;align-items:center}.st .av,.list .av{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;margin-right:10px}.st i.av{display:inline-flex;align-items:center;justify-content:center;background:#e6e8ee;color:#6b7080;font-style:normal;font-weight:700;font-size:15px}
.av.gold{outline:3px solid #f5c518;outline-offset:1px;box-shadow:0 0 10px 2px rgba(245,197,24,.75)}
.tv .kid.gold{background:linear-gradient(135deg,rgba(120,84,0,.95),rgba(60,40,0,.92));border-color:#fff3a8 #f5c518 #f5c518 #fff3a8;box-shadow:0 0 1.2vw .2vw rgba(255,215,64,.85);animation:oro 2.4s ease-in-out infinite}
.tv .kid.gold{position:relative}.tv .kid.gold:after{content:'★';position:absolute;right:.5vw;top:.1vw;color:#ffe066;font-size:1.7vw;text-shadow:0 0 .6vw #ffbf00}
.tv .kid.gold .avw .av{outline:.25vw solid #ffd84a;outline-offset:0;box-shadow:0 0 1vw rgba(255,216,74,.9)}
@keyframes oro{0%,100%{box-shadow:0 0 .8vw .1vw rgba(255,215,64,.6)}50%{box-shadow:0 0 1.8vw .4vw rgba(255,215,64,1)}}
.v small.blk{display:block;font-size:12px;color:var(--ok);font-weight:700}
.ksum{display:flex;gap:12px;align-items:center;margin-bottom:12px}.ksum .av{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}.ksum i.av{display:flex;align-items:center;justify-content:center;background:#3a3b4d;color:#fff;font-style:normal;font-size:28px;font-weight:700}
.tv .kid{cursor:pointer}
.bank .av{position:absolute;top:14px;right:14px;width:72px;height:72px;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.7);z-index:1}.bank i.av{display:none}.bank .lab,.bank .who{padding-right:84px}
.bank .who{font-size:22px;font-weight:700;margin:0 0 2px}
.bank .lab{font-size:12px;color:#b9c3dd;text-transform:uppercase;letter-spacing:.06em}
.bank .big{font-size:54px;font-weight:800;line-height:1;margin:10px 0 2px;color:var(--gold2)}
.bank .big span{font-size:22px;font-weight:600;color:#fff;margin-left:6px}
.stats{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
.stats div{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:10px}
.stats b{display:block;font-size:18px}
.stats small{color:#b9c3dd;font-size:12px}
.bar{height:14px;background:#ece7d8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.row{display:flex;align-items:center;gap:10px}
.mv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mv:first-of-type{border-top:0}
.mv .d{flex:1;min-width:0}
.mv .d b{display:block;font-weight:600;font-size:15px}
.mv .d small{color:var(--mut);font-size:12px}
.mv .v{font-weight:700;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}.cop{color:var(--navy2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.btn{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:60px;font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;min-width:0;color:var(--ink);text-decoration:none}
.btn:active{transform:scale(.98);background:#faf7ee}
.btn .pt{flex:none;min-width:40px;height:40px;border-radius:10px;background:#fff6d6;color:#8a6100;display:grid;place-items:center;font-weight:800;font-size:15px;padding:0 6px}
.btn.minus .pt{background:#fde8e8;color:var(--bad)}
.btn.ma .pt{background:#e3ecff;color:var(--navy2)}
.btn.done{border-color:var(--ok);background:#effaf3}
@media (max-width:480px){.btn{padding:10px 8px;gap:8px;font-size:13.5px}.btn .pt{min-width:34px;height:34px;font-size:14px}.grid{gap:8px}.card{padding:14px 12px}}
.pri{background:var(--navy);color:#fff;border-radius:12px;padding:14px 18px;font-weight:700;width:100%;font-size:16px}
.sec{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600}
.pri:disabled{opacity:.4}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav{display:flex}
.nav button{flex:1;min-width:0;padding:10px 2px 12px;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
.nav button b{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--navy)}
.lote{background:var(--navy);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center}
.lote select{flex:1;min-width:0;padding:11px 8px;border-radius:10px;border:0;background:#fff;color:var(--ink)}
.lote button{background:var(--gold);color:var(--navy);font-weight:800;border-radius:10px;padding:11px 14px;white-space:nowrap}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.st{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px}
.st.sel{border-color:var(--navy);background:#eef2fb}
.ck{flex:none;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:20px;color:transparent;background:#fff}
.st.sel .ck{background:var(--navy);border-color:var(--navy);color:#fff}
.st .n{flex:1;min-width:0;text-align:left;padding:8px 0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .s{font-weight:700;color:#8a6100;white-space:nowrap}
.tog{display:flex;align-items:center;gap:12px}
.sw{flex:none;width:56px;height:32px;border-radius:99px;background:#cfc9b8;position:relative}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on:after{left:27px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}
td.y{color:var(--ok);font-weight:700}td.n{color:#c9c3b3}
#modal{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.sheet textarea,.sheet input{margin-top:4px;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 16px}
.step button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);font-size:26px;font-weight:700}
.step b{font-size:38px;min-width:120px;text-align:center}
#toast{position:fixed;left:10px;right:10px;top:calc(70px + env(safe-area-inset-top));z-index:30;display:none;justify-content:center;pointer-events:none}
#toast.on{display:flex}
#toast div{pointer-events:auto;background:#1b2333;color:#fff;border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:8px;align-items:center;max-width:560px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px}
#toast button{color:var(--gold2);font-weight:800;padding:6px 8px;white-space:nowrap}
#toast .x{color:#aab3c7;font-size:16px}
#busy{position:fixed;top:0;left:0;right:0;height:4px;background:var(--gold);z-index:40;display:none;animation:bz 1s infinite alternate}
@keyframes bz{from{opacity:.3}to{opacity:1}}
.flash{position:fixed;inset:0;z-index:25;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.flash.ok{background:var(--ok)}.flash.dup{background:var(--warn)}.flash.err{background:var(--bad)}
.flash .ic{font-size:96px;line-height:1}
.flash h2{font-size:30px;margin:0}
.flash p{font-size:20px;margin:0}
.flash button{margin-top:18px;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:14px 22px;font-weight:700}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px}
.center .logo{width:84px;height:84px;border-radius:24px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:48px}
.center p{color:var(--mut)}
.foot{text-align:center;margin:18px 0}
.foot button{color:var(--mut);font-size:13px;text-decoration:underline;padding:10px}
.url{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut);word-break:break-all}
.note{color:var(--mut);font-size:13px;margin:14px 2px}
/* Lector de QR */
.scan{position:fixed;inset:0;z-index:18;background:#000;color:#fff;display:flex;flex-direction:column}
.scan video{flex:1;min-height:0;width:100%;object-fit:cover}
.scan .bar2{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--navy)}
.scan .bar2 b{flex:1;font-size:16px}
.scan .bar2 button{color:#fff;background:rgba(255,255,255,.15);border-radius:10px;padding:9px 11px;font-weight:700;font-size:13px}
.scan .bar2 button.on{background:var(--ok)}
.scan .aim{position:absolute;left:50%;top:50%;width:62vw;max-width:320px;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid rgba(255,255,255,.85);border-radius:18px;pointer-events:none}
.scan .res{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));background:var(--navy);min-height:96px;font-size:15px}
.scan .res b{display:block;font-size:21px;margin-bottom:2px}
.scan .res.ok{background:var(--ok)}.scan .res.dup{background:var(--warn)}.scan .res.err{background:var(--bad)}
/* Tarjetas para imprimir */
.cards{position:fixed;inset:0;z-index:18;background:#fff;overflow:auto;padding:8mm}
.cards .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8mm}
.cards .tools span{color:#555;font-size:13px}
.cards .sheet2{display:flex;flex-direction:column;align-items:center;gap:7mm}
.unit{display:flex;width:171.2mm;height:54mm;position:relative;break-inside:avoid;page-break-inside:avoid;outline:.2mm dashed #9a9a9a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.unit:before,.unit:after{content:"";position:absolute;left:50%;height:3mm;border-left:.25mm solid #555}
.unit:before{top:-3.6mm}.unit:after{bottom:-3.6mm}
.cf,.cb{width:85.6mm;height:54mm;position:relative;overflow:hidden;color:#fff;background-color:#14151c;background-size:108% auto;background-position:center;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
.cf .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.66) 0,rgba(0,0,0,.3) 46%,rgba(0,0,0,0) 70%),linear-gradient(0deg,rgba(0,0,0,.6) 0,rgba(0,0,0,0) 44%)}
.cb .shade{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.cf .ttl{position:absolute;left:5.2mm;top:4.2mm;font-family:var(--px);font-size:7mm;line-height:1;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.cf .ttl span{position:absolute;left:0;top:0}.cf .ttl .l2{top:1.25mm;color:#101010}.cf .ttl .l1{top:.6mm;color:#8a8a8a}.cf .ttl .l0{position:relative;color:#ececec}
.cf .ttl:before{top:.6mm;color:#8a8a8a;z-index:-1}
.cf .ttl:after{top:1.25mm;color:#101010;z-index:-2}
.cf .grp{position:absolute;left:5.4mm;top:13.6mm;font-family:var(--px);font-size:3.5mm;letter-spacing:.22em;color:#ffd966}
.cf .chip{position:absolute;left:5.6mm;top:19.4mm;width:11.4mm;height:8.8mm;border-radius:1.7mm;background:linear-gradient(135deg,#f9e79a 0,#c79a1e 52%,#f4dc7c 100%);box-shadow:inset 0 0 0 .25mm #8a6510,.25mm .35mm .7mm rgba(0,0,0,.55)}
.cf .chip:before{content:"";position:absolute;left:0;right:0;top:31%;bottom:31%;border-top:.22mm solid #8a6510;border-bottom:.22mm solid #8a6510}
.cf .chip:after{content:"";position:absolute;top:0;bottom:0;left:32%;right:32%;border-left:.22mm solid #8a6510;border-right:.22mm solid #8a6510;border-radius:1.1mm;background:linear-gradient(135deg,#f4dc7c,#d2a428)}
.cf .wave{position:absolute;left:19.4mm;top:20.6mm;width:6.4mm;height:6.4mm;filter:drop-shadow(.2mm .3mm .3mm rgba(0,0,0,.7))}
.cf .num,.cf .name,.cf .meta b{font-family:"Share Tech Mono",ui-monospace,"SF Mono",Menlo,monospace;color:#f2f2f2;text-shadow:0 -.14mm 0 rgba(255,255,255,.55),0 .34mm .25mm rgba(0,0,0,.9)}
.cf .num{position:absolute;left:5.6mm;top:31.4mm;font-size:5.3mm;letter-spacing:.05em;word-spacing:1.3mm;white-space:nowrap}
.cf .meta{position:absolute;left:5.6mm;top:39mm;display:flex;gap:6mm}
.cf .meta span{display:block;font-size:1.55mm;letter-spacing:.1em;color:#e0e0e0;text-shadow:0 .2mm .2mm rgba(0,0,0,.9)}
.cf .meta b{display:block;font-size:3.1mm;font-weight:400;margin-top:.3mm}
.cf .name{position:absolute;left:5.6mm;bottom:4.3mm;font-size:3.7mm;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand{position:absolute;right:4.6mm;bottom:3.8mm;display:flex;align-items:center;gap:1mm;font-style:italic;font-weight:800;font-size:5.4mm;line-height:1;letter-spacing:-.02em;color:#fff;text-shadow:.25mm .35mm .5mm rgba(0,0,0,.85)}
.brand .cube{width:5.6mm;height:5.6mm;flex:none;filter:drop-shadow(.2mm .3mm .3mm rgba(0,0,0,.7))}
.cb .stripe{position:absolute;left:0;right:0;top:5mm;height:10mm;background:#08080a}
.cb .lab{position:absolute;left:5mm;top:17.2mm;font-size:1.55mm;letter-spacing:.1em;color:#dcdcdc}
.cb .sig{position:absolute;left:5mm;top:19.6mm;width:44mm;height:8mm;border-radius:.6mm;background:repeating-linear-gradient(0deg,#f6f3e8 0 .8mm,#e3ddc8 .8mm 1mm)}
.cb .cvv{position:absolute;left:50.4mm;top:19.6mm;width:8.6mm;height:8mm;border-radius:.6mm;background:#fff;color:#14151c;display:grid;place-items:center;font-family:"Share Tech Mono",ui-monospace,Menlo,monospace;font-style:italic;font-size:3.5mm}

<script>

  } catch (e) {}
}
function fromCache(first) {
  if (!first) return false;

  try {
    if (S.token) {
      if (S.code && ma) return false;
      var c = JSON.parse(ls('bv_cache') || 'null');
      if (!c || !c.T) return false;
      S.T = c.T; S.pub = c.pub;
      if (S.code) {
        var s = null; S.T.estudiantes.forEach(function (x) { if (x.codigo === S.code) s = x; });

    if (S.code) {
      var p = JSON.parse(ls('bv_pub_' + S.code) || 'null');

  } catch (e) {}

}
function load(first) {

  if (rapido) render(); else busy(true);
  var seq = WSEQ;
  call('boot', S.code, S.token, !!first && ls('bv_ma') === '1').then(function (o) {
    if (!P) busy(false);
    saveCache(o);
    if (rapido && WSEQ !== seq) return;   // ya hubo registros nuevos: settle() vuelve a cargar
    S.pub = o.pub; S.T = o.T;
    if (o.tokenInvalido) { ls('bv_token', null); ls('bv_cache', null); S.token = ''; }

      var r = o.auto, n = o.pub.estudiante.nombre;

    }

}

/* ───────── Vistas ───────── */
function render() {
  var h;
  if (S.flash) h = vFlash();
  else if (!S.T) h = vPublic();
  else if (S.cur) h = vTop(true) + '<div class="wrap">' + vFicha() + '</div>';
  else if (S.tab === 'scan') h = vScan();
  else if (S.tab === 'cards') h = vCards();
  else if (S.tab === 'tablero') h = vTablero();
  else {
    var lote = S.tab === 'grupo' ? vLote() : '';
    h = vTop(false) + '<div class="wrap' + (lote ? ' haslote' : '') + '">' + (S.tab === 'mano' ? vMano() : S.tab === 'mas' ? vMas() : vGrupo()) + '</div><div class="bottom">' + lote + vNav() + '</div>';
  }

}
function vFlash() {
  var f = S.flash;
  return '<div class="flash ' + f.k + '"><div class="ic">' + f.ic + '</div><h2>' + esc(f.h) + '</h2><p>' + esc(f.p) + '</p>' +
    '<p style="font-size:15px;opacity:.85;margin-top:10px">Modo rápido Mano Amiga activo. Acerca la siguiente tarjeta.</p>' +

    '<button data-a="flashClose">Ver ficha</button></div>';

function vTop(back) {

    '<div><h1>' + esc(c.banco) + '</h1><small>Semana ' + S.T.sem + '</small></div><div class="sp"></div>' + (back ? '<button class="lnk" data-a="scan">▣ Escanear</button>' : '') + '</div>';

function vNav() {

  return '<div class="nav">' + t.map(function (x) { return '<button data-a="' + (x[0] === 'scan' ? 'scan' : 'tab') + '" data-t="' + x[0] + '" class="' + (S.tab === x[0] ? 'on' : '') + '"><b>' + x[1] + '</b>' + x[2] + '</button>'; }).join('') + '</div>';
}
function metaCard(m) {

  return '<div class="card"><p class="h">Meta del grupo</p><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>' + m.actual + ' / ' + m.objetivo + ' ' + ICO + '</b><span>' + pct + '%</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div><p style="margin:10px 0 0;color:var(--mut);font-size:14px">Premio: ' + esc(m.premio) + '</p></div>';

/* ───────── Mano Amiga: aportes agrupados y calendario de semanas ───────── */
function cfgA() { return (S.T || S.pub).cfg; }
function sinClase() { var o = {}; (cfgA().sinClase || []).forEach(function (k) { o[k] = true; }); return o; }
/** Bloques de racha: semanas de clase de N en N; las vacaciones se saltan (igual que en el servidor). */
function bloques() { var n = cfgA().rachaSem || 4, sc = sinClase(), out = [], cur = []; for (var k = 1; k <= 80; k++) { if (sc[k]) continue; cur.push(k); if (cur.length === n) { out.push(cur); cur = []; } } return out; }
function diaSem(k, d) { return new Date(cfgA().inicio + (k - 1) * 6048e5 + d * 864e5); }
function fCorta(dt) { try { return dt.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } }
function rango(ws) {
  ws = ws.slice().sort(function (a, b) { return a - b; });
  var out = [], i = 0;
  while (i < ws.length) { var j = i; while (j + 1 < ws.length && ws[j + 1] === ws[j] + 1) j++; out.push(j > i ? ws[i] + '–' + ws[j] : String(ws[i])); i = j + 1; }
  return (ws.length > 1 ? 'semanas ' : 'semana ') + out.join(', ');
}
/** Agrupa las filas de un mismo aporte (mismo pago) para mostrarlas como una sola línea. */
function pagos(eid, movs) {
  var a = cfgA().aporte || 2000, gs = [], cur = null, last = 0;
  var lista = movs.filter(function (m) { return m.eid === eid; }).slice().sort(function (x, y) { return x.t - y.t; });
  lista.forEach(function (m) {
    if (m.cuenta === 'PUNTOS') return;
    var tag = (String(m.nota).match(/pago:([\w-]+)/) || [])[1] || '';
    var mismo = cur && (tag ? cur.tag === tag : (!cur.tag && m.t - last <= 12000));
    if (!mismo) { cur = { tag: tag, t0: m.t, t1: m.t, total: 0, weeks: [], extra: 0, blocks: 0, ids: [], tmp: false }; gs.push(cur); }
    cur.t1 = m.t; last = m.t; cur.total += m.valor; cur.ids.push(m.id); if (m.tmp) cur.tmp = true;
    if (/extra/i.test(m.nota + ' ' + m.categoria)) cur.extra += m.valor; else if (cur.weeks.indexOf(m.semana) < 0) cur.weeks.push(m.semana);
  });
  lista.forEach(function (m) {
    if (m.cuenta !== 'PUNTOS' || m.categoria !== 'Constancia Mano Amiga') return;
    for (var i = gs.length - 1; i >= 0; i--) if (gs[i].weeks.indexOf(m.semana) >= 0 && m.t >= gs[i].t0 - 60000) { gs[i].blocks += m.valor; gs[i].ids.push(m.id); if (m.tmp) gs[i].tmp = true; break; }
  });

}
function pagoRow(g, undo) {
  var det = (g.weeks.length ? rango(g.weeks) : 'aporte extra') + (g.weeks.length && g.extra ? ' · ' + cop(g.extra) + ' extra' : '');
  return '<div class="mv"><div class="d"><b>Aporte Mano Amiga</b><small>' + fecha(g.t0) + ' · ' + det + '</small></div>' +
    '<div class="v cop" style="text-align:right">' + cop(g.total) + (g.blocks ? '<small class="blk">+' + g.blocks + ' ' + ICO + '</small>' : '') + '</div>' +
    (undo ? (g.tmp ? '<span style="color:var(--mut);font-size:12px;padding:6px 10px">Guardando…</span>' : '<button class="sec" style="padding:6px 10px;font-size:12px" data-a="undoPago" data-ids="' + esc(g.ids.join(',')) + '" data-v="' + g.total + '">Anular</button>') : '') + '</div>';
}
/** Historial del estudiante: los aportes van agrupados y lo demás igual que antes. */
function historial(eid, movs, n, undo) {
  var gs = pagos(eid, movs), usados = {}, items = [];
  gs.forEach(function (g) { g.ids.forEach(function (id) { usados[id] = 1; }); items.push({ t: g.t1, h: pagoRow(g, undo) }); });
  movs.forEach(function (m) { if (m.eid === eid && !usados[m.id]) items.push({ t: m.t, h: mvRow(m, undo && !m.auto) }); });

}
/** Calendario de Mano Amiga por rachas de 4 semanas de clase, con las vacaciones aparte. */
function semanasHtml(s, sem) {
  var c = cfgA(); if (!c.inicio) return '';
  var sc = sinClase(), bs = bloques(), maxW = sem, k, ini = 0, fin = 0;
  for (k in s.semanas) if (+k > maxW && s.semanas[k] > 0) maxW = +k;

  var h = '<div class="wk">';
  for (var i = ini; i <= fin; i++) {

  if (SC.stream) { SC.stream.getTracks().forEach(function (t) { t.stop(); }); SC.stream = null; }
}
function scanTick() {
  var v = $('cam');
  if (!v || !v.videoWidth || typeof jsQR === 'undefined') return;
  var w = 480, h = Math.round(v.videoHeight * 480 / v.videoWidth);
  if (!SC.cv) SC.cv = document.createElement('canvas');
  SC.cv.width = w; SC.cv.height = h;
  var cx = SC.cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(v, 0, 0, w, h);
  var q = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
  if (q && q.data) scanGot(q.data);
}
function codeFrom(t) { var m = /[?&]t=([0-9a-zA-Z]+)/.exec(t); return m ? m[1] : String(t).trim(); }
function beep() {
  try {
    var C = window.AudioContext || window.webkitAudioContext, a = beep.c || (beep.c = new C());
    var o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .12);
  } catch (e) {}
}
function scanGot(text) {
  var c = codeFrom(text), now = Date.now();
  if (c === SC.last && now - SC.lastT < 4000) return;
  SC.last = c; SC.lastT = now;
  var s = null;
  S.T.estudiantes.forEach(function (x) { if (x.codigo === c) s = x; });
  if (!s) { scanMsg('err', 'Tarjeta no reconocida', 'Ese código no es de este banco, o la tarjeta fue repuesta.'); return; }
  beep();
  if (ls('bv_ma') === '1') {
    var w = S.T.sem;
    if (s.semanas[w] > 0) { scanMsg('dup', s.nombre, 'Ya había aportado esta semana (' + cop(s.semanas[w]) + '). No se registró de nuevo.'); return; }
    doAporte(s.id, S.T.cfg.aporte, w, false);
    $('toast').className = '';
    scanMsg('ok', s.nombre, cop(S.T.cfg.aporte) + ' para Mano Amiga' + (S.T.cfg.puntosAporte > 0 ? ' · +' + S.T.cfg.puntosAporte + ' ' + un(S.T.cfg.puntosAporte) + '' : '') + '. Siguiente tarjeta.');
    return;
  }
  scanStop(); S.tab = 'grupo'; S.cur = s.id; render(); window.scrollTo(0, 0);
}

/* ───────── Registro instantáneo ─────────
   La pantalla se actualiza de inmediato y el guardado en Google ocurre en segundo plano.
   Si el guardado falla, se avisa y se recargan los datos reales. */
var P = 0, recT = null, tmpN = 0;
function bg(fn, p, onOk) {
  P++; WSEQ++; busy(true);
  call(fn, S.token, p).then(function (o) {
    P--; if (!P) busy(false);
    if (onOk) onOk(o.r);
    settle();
  }).catch(function (e) {
    P--; if (!P) busy(false);
    fail(e);
    if (S.token) { toast('No se pudo guardar. Se recargaron los datos; revisa e inténtalo de nuevo.'); load(false); }
  });
}
function settle() {
  clearTimeout(recT);
  recT = setTimeout(function () {
    if (P || !S.T) return;
    call('boot', '', S.token).then(function (o) { saveCache(o); if (!P && o.T && S.T) { S.T = o.T; render(); } }).catch(function () {});
  }, 6000);
}
function applyL(m, k) {
  var T = S.T, s = est(m.eid), v = m.valor * k;
  if (!s) return;
  if (m.cuenta === 'PUNTOS') {
    s.saldo += v;
    if (m.valor > 0) { s.ganadas += v; if (m.semana === T.sem) s.ganadasSemana += v; T.meta.actual += v; }
  } else {
    s.semanas[m.semana] = (s.semanas[m.semana] || 0) + v; s.aporteTotal += v; T.totalMA += v;
  }
}
function addMovL(s, cuenta, categoria, valor, nota, w) {
  var m = { id: 'tmp' + (++tmpN), tmp: true, t: Date.now(), semana: w || S.T.sem, eid: s.id, cuenta: cuenta, tipo: '', categoria: categoria, valor: valor, nota: nota || '' };
  applyL(m, 1); S.T.movs.unshift(m);
  return m;
}
function setIds(ms, ids) { (ids || []).forEach(function (id, i) { if (ms[i]) { ms[i].id = id; ms[i].tmp = false; } }); }
function registrarL(ids, cat, valor, nota, libre, msg) {
  var ms = ids.map(function (id) { return addMovL(est(id), 'PUNTOS', libre ? 'Registro libre' : cat, valor, nota); });
  modal(null); render(); toast(msg);
  bg('registrar', { ids: ids, categoria: cat, valor: valor, nota: nota, libre: libre }, function (r) {
    setIds(ms, r.ids);
    if (libre) ms.forEach(function (m) { m.categoria = r.categoria; });
    toastIds(msg, msg + (libre ? ' · ' + r.categoria : ''), r.ids); render();
  });
}
function doAporte(id, valor, w, forzar) {
  var s = est(id), T = S.T;
  valor = Math.round(Number(valor) || 0);
  w = Math.max(1, Math.round(Number(w) || T.sem));
  if (!(valor > 0)) { toast('El monto debe ser mayor que cero.'); return; }
  var ya = s.semanas[w] || 0;
  if (ya > 0 && !forzar) {
    ask('Ya aportó en la semana ' + w, s.nombre + ' ya tiene ' + cop(ya) + ' registrados esa semana. ¿Sumar otro aporte de ' + cop(valor) + '?', 'Sí, sumar', function () { doAporte(id, valor, w, true); });
    return;
  }
  var pago = Date.now().toString(36);
  var ms = [addMovL(s, 'MANO_AMIGA', 'Aporte Mano Amiga', valor, 'pago:' + pago, w)];
  if (!ya && T.cfg.puntosAporte > 0) ms.push(addMovL(s, 'PUNTOS', 'Constancia Mano Amiga', T.cfg.puntosAporte, 'Semana ' + w, w));
  var msg = s.corto + ': ' + cop(valor) + (ms.length > 1 ? ' · +' + T.cfg.puntosAporte + ' ' + un(T.cfg.puntosAporte) + '' : '');
  modal(null); render(); toast(msg);
  bg('aporte', { id: id, valor: valor, semana: w, forzar: true, pago: pago }, function (r) {
    setIds(ms, r.ids);
    toastIds(msg, msg, r.ids); render();
  });
}

/* Reparte un aporte en cuotas semanales: primero semanas pendientes (hasta 3 atrás),
   luego la semana actual y después semanas adelantadas (hasta 4). Lo que sobre queda como extra. */
function planAporte(s, total, w) {
  var a = S.T.cfg.aporte, rem = Math.round(total), plan = [], k, sc = sinClase();
  function libre(k) { return !sc[k] && !(s.semanas[k] > 0) && !plan.some(function (e) { return e.w === k; }); }
  var atras = []; for (k = w - 1; k >= 1 && atras.length < 3; k--) if (!sc[k]) atras.unshift(k);
  atras.forEach(function (k) { if (rem >= a && libre(k)) { plan.push({ w: k, v: a, tipo: 'pendiente' }); rem -= a; } });
  if (rem >= a && libre(w)) { plan.push({ w: w, v: a, tipo: 'esta semana' }); rem -= a; }
  for (var adel = 0, k = w + 1; adel < 4 && rem >= a && k < w + 60; k++) { if (sc[k]) continue; adel++; if (libre(k)) { plan.push({ w: k, v: a, tipo: 'adelantada' }); rem -= a; } }
  if (rem > 0) {
    if (libre(w)) plan.push({ w: w, v: rem, tipo: 'esta semana' });          // monto menor a lo sugerido: cubre la semana actual
    else plan.push({ w: w, v: rem, tipo: 'extra', extra: true });           // lo que sobra es aporte extra, sin block
  }
  return plan;
}
function textoPlan(plan) {
  var ws = plan.filter(function (e) { return !e.extra; }), ex = plan.filter(function (e) { return e.extra; })[0];
  var b = ws.length * (S.T.cfg.puntosAporte || 0);
  return (ws.length ? 'cubre ' + rango(ws.map(function (e) { return e.w; })) + (b ? ' (+' + b + ' ' + un(b) + ')' : '') : '') +
    (ex ? (ws.length ? ' y ' : '') + cop(ex.v) + ' como aporte extra (sin block' + (ws.length ? '; solo se adelantan hasta 4 semanas' : '') + ')' : '') + '.';
}
function doPlan(id, plan) {
  var s = est(id), T = S.T, blocks = 0, pago = Date.now().toString(36);
  plan.forEach(function (e) {
    var ya = s.semanas[e.w] || 0;
    e.ms = [addMovL(s, 'MANO_AMIGA', e.extra ? 'Aporte extra Mano Amiga' : 'Aporte Mano Amiga', e.v, 'pago:' + pago + (e.extra ? ' extra' : ''), e.w)];
    if (!ya && !e.extra && T.cfg.puntosAporte > 0) { e.ms.push(addMovL(s, 'PUNTOS', 'Constancia Mano Amiga', T.cfg.puntosAporte, 'Semana ' + e.w, e.w)); blocks += T.cfg.puntosAporte; }
  });
  var total = plan.reduce(function (t, e) { return t + e.v; }, 0);
  var msg = s.corto + ': ' + cop(total) + (plan.length > 1 ? ' en ' + plan.length + ' semanas' : '') + (blocks ? ' · +' + blocks + ' ' + un(blocks) : '');
  modal(null); render(); toast(msg);
  (function run(i) {
    if (i >= plan.length) return;
    var e = plan[i];
    bg('aporte', { id: id, valor: e.v, semana: e.w, forzar: true, pago: pago, extra: !!e.extra }, function (r) {
      setIds(e.ms, r.ids);
      render(); run(i + 1);
    });
  })(0);
}
